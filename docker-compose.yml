services:
  backend:
    build:
      context: ./back-end
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      # Compose substitutes these from the shell or from a .env file next to
      # this compose file. See .env.example.
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set (see .env.example)}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      NODE_ENV: production
      PORT: 5000
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ./front-end
      args:
        # Baked into the bundle at build time — must be reachable from the
        # browser, not from inside the compose network.
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped
